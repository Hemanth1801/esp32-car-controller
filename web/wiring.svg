<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">ESP32 DevKit V1 and L298N wiring</title><desc id="desc">GPIO25 to IN1, GPIO26 to IN2, GPIO27 to IN3, GPIO14 to IN4, GPIO32 to ENA, GPIO33 to ENB. Remove ENA and ENB jumpers. OUT1/OUT2 drive the car, OUT3/OUT4 steer. Remove the 5V-EN regulator jumper when feeding separate unboosted 5 V logic power. All grounds are common.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e7ecf4}.title{font-size:25px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#aab7c9}.pin{font:17px Consolas,monospace}.panel{fill:#232d3b;stroke:#526175;stroke-width:2}.signal{fill:none;stroke-width:4}.ground{fill:none;stroke:#aab7c9;stroke-width:5}.power{fill:none;stroke:#f49c65;stroke-width:5}</style></defs>
<rect width="1200" height="900" rx="20" fill="#171e29"/><text x="36" y="46" class="title">ESP32 + L298N / spring-return DC steering</text><text x="36" y="78" class="small">Motor mode after Arm / 100% output limit / remove ENA and ENB jumpers before connecting enable wires</text>
<rect class="panel" x="40" y="135" width="280" height="435" rx="15"/><text x="65" y="174" class="title">ESP32 DevKit V1</text><text x="65" y="203" class="small">D numbers = GPIO, not pin positions</text>
<rect class="panel" x="520" y="135" width="290" height="435" rx="15"/><text x="550" y="174" class="title">L298N module</text>
<g class="pin"><text x="175" y="240">D25</text><text x="175" y="280">D26</text><text x="175" y="320">D27</text><text x="175" y="360">D14</text><text x="175" y="420">D32</text><text x="175" y="460">D33</text><text x="545" y="240">IN1</text><text x="545" y="280">IN2</text><text x="545" y="320">IN3</text><text x="545" y="360">IN4</text><text x="545" y="420">ENA</text><text x="545" y="460">ENB</text></g>
<path d="M320 234H520" class="signal" stroke="#5bd4b7"/><path d="M320 274H520" class="signal" stroke="#67b1ff"/><path d="M320 314H520" class="signal" stroke="#cca0ff"/><path d="M320 354H520" class="signal" stroke="#f2d27c"/><path d="M320 414H520" class="signal" stroke="#ff9d6c"/><path d="M320 454H520" class="signal" stroke="#f18bbb"/>
<text x="350" y="494" class="small">10 kohm: ENA and ENB to GND</text>
<g class="pin"><text x="703" y="245">OUT1</text><text x="703" y="280">OUT2</text><text x="703" y="365">OUT3</text><text x="703" y="400">OUT4</text></g><path d="M810 239H920V230H948M810 274H920V270H948" class="signal" stroke="#5bd4b7"/><circle cx="985" cy="250" r="37" class="panel"/><text x="971" y="258" class="title">M</text><text x="1040" y="245" class="label">Drive</text><text x="1040" y="270" class="small">2 wires</text>
<path d="M810 359H920V350H948M810 394H920V390H948" class="signal" stroke="#cca0ff"/><circle cx="985" cy="370" r="37" class="panel"/><text x="971" y="378" class="title">M</text><text x="1040" y="365" class="label">Steering</text><text x="1040" y="390" class="small">Spring return</text>
<g class="pin"><text x="65" y="540">GND</text><text x="150" y="540">USB 5V</text><text x="540" y="540">GND</text><text x="640" y="540">5V</text><text x="705" y="540">VS/+12V</text></g>
<path d="M100 570V805H1120M560 570V805M150 745V805M450 745V805" class="ground"/>
<rect x="40" y="640" width="320" height="105" rx="12" class="panel"/><text x="60" y="675" class="label">Power bank / unboosted 5 V, 2 A</text><text x="60" y="706" class="small">ESP USB + L298N 5 V logic input</text><path d="M200 640V610H210V570M200 610H660V570" class="power"/>
<rect x="410" y="640" width="370" height="105" rx="12" fill="#27312c" stroke="#5bd4b7"/><text x="430" y="675" class="label">XL6009 / rated motor supply</text><text x="430" y="706" class="small">Set voltage for motors, not the board label</text><path d="M740 570V615H580V640" class="power"/>
<rect x="850" y="580" width="310" height="165" rx="12" fill="#3b3024" stroke="#e4bb70"/><text x="870" y="615" class="label">Jumper setup</text><text x="870" y="645" class="small">Remove ENA and ENB jumpers.</text><text x="870" y="672" class="small">Remove 5V-EN regulator jumper</text><text x="870" y="696" class="small">when feeding separate 5 V logic.</text><text x="870" y="723" class="small">Never put 5 V on ESP GPIO.</text>
<text x="390" y="839" class="small">COMMON GROUND: ESP32 + driver + bank + converter negative</text><text x="40" y="876" class="small">100% uses the motor supply through the driver. Motor ratings still apply. No output terminal is permanent GND.</text></svg>
